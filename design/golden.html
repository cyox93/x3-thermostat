<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>x3 thermostat — golden frames (240×240)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
html,body{margin:0;background:#000;color:#f5f3ee;font-family:'Pretendard',sans-serif}
*{box-sizing:border-box;animation:none!important;transition:none!important}
.lcd{width:240px;height:240px;position:relative;overflow:hidden;background:#0e0e10}
.single .lcd{border-radius:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:24px;padding:24px;background:#222}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gallery figcaption{font-family:'JetBrains Mono',monospace;font-size:11px;color:#aaa}
.gallery .lcd{border-radius:50%}
</style>
</head>
<body>
<div id="golden"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="src/boiler-app.jsx"></script>
<script type="text/babel" src="src/golden-states.jsx"></script>
</body>
</html>
