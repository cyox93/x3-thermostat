<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Round Remote — Boiler · 1.28" 240×240</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root { --bg:#f4f3ef; --ink:#1a1a1a; --ink-2:#555; --ink-3:#999; --line:#e0ddd6; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:'Inter Tight','Pretendard',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:60px 20px; gap:36px; }

  .header { text-align:center; max-width:680px; }
  .header .meta { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#888; }
  .header h1 { font-family:'Instrument Serif',serif; font-style:italic; font-size:64px; margin:8px 0 12px; line-height:1; }
  .header p { color:#555; font-size:14px; line-height:1.6; margin:0; font-family:'Pretendard',sans-serif; }

  .stage { display:flex; align-items:center; gap:80px; flex-wrap:wrap; justify-content:center; }

  /* knob: encoder ring + screen + single push button below */
  .knob {
    position:relative; width:360px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    user-select:none;
  }
  .knob-frame {
    width:360px; height:360px; border-radius:50%;
    position:relative; isolation:isolate;
    background:
      radial-gradient(circle at 50% 35%, #2a2a2a 0%, #1a1a1a 60%, #0c0c0c 100%);
    box-shadow:
      0 0 0 1px #444,
      0 30px 60px -20px rgba(0,0,0,.55),
      0 10px 20px -10px rgba(0,0,0,.35),
      inset 0 1px 2px rgba(255,255,255,.06),
      inset 0 -2px 8px rgba(0,0,0,.5);
    cursor: grab;
    touch-action: none;
    display:flex; align-items:center; justify-content:center;
  }
  .knob-frame:active { cursor: grabbing; }
  /* encoder notch — single dot at the top of the dial */
  .knob-notch {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%;
    background:#e88a5e; opacity:.5;
    box-shadow:0 0 8px rgba(232,138,94,.6);
  }
  /* the actual 240x240 LCD screen sits inside the knob */
  .screen {
    width:240px; height:240px; border-radius:50%;
    overflow:hidden; background:#0e0e10; color:#f5f3ee;
    position:relative;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.04),
      inset 0 4px 12px rgba(0,0,0,.6),
      0 0 0 2px #050505,
      0 0 0 6px #1d1d1d;
  }
  /* push button below the dial */
  .pushbtn {
    width:88px; height:38px; border-radius:19px;
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #0e0e0e 100%);
    border: 1px solid #444;
    box-shadow:
      0 4px 8px -2px rgba(0,0,0,.5),
      inset 0 1px 1px rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.2em;
    color:#888;
    cursor:pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .pushbtn:active, .pushbtn.pressed {
    transform: translateY(2px);
    box-shadow:
      0 1px 2px -1px rgba(0,0,0,.5),
      inset 0 1px 3px rgba(0,0,0,.5);
  }
  .pushbtn .led {
    width:6px; height:6px; border-radius:50%;
    background:#e88a5e; box-shadow:0 0 6px rgba(232,138,94,.7);
    margin-right:8px;
  }

  .controls {
    display:flex; flex-direction:column; gap:14px; max-width:300px;
    font-family:'Pretendard',sans-serif;
  }
  .controls h3 {
    font-family:'Instrument Serif',serif; font-style:italic; font-size:24px; margin:0 0 4px;
  }
  .ctrl-grid {
    display:grid; grid-template-columns:auto 1fr; gap:10px 14px;
    font-size:13px;
  }
  .ctrl-key {
    font-family:'JetBrains Mono',monospace; font-size:11px;
    background:#fff; border:1px solid var(--line); padding:3px 8px; border-radius:6px;
    color:#333; text-align:center; white-space:nowrap; align-self:center;
  }
  .ctrl-val { color:#444; align-self:center; }

  .matrix {
    margin-top:8px;
    border:1px solid var(--line); background:#fff; border-radius:12px;
    padding:14px 16px;
  }
  .matrix .label { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#999; margin-bottom:8px; }

  .footnote { font-size:12px; color:#888; max-width:380px; line-height:1.6; font-family:'Pretendard',sans-serif; }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#1a1a1a"/>
    <circle cx="100" cy="100" r="58" fill="#0e0e10" stroke="#444" stroke-width="2"/>
    <circle cx="100" cy="100" r="58" fill="none" stroke="#e88a5e" stroke-width="1.5" opacity=".7"/>
    <text x="100" y="108" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#f5f3ee">Boiler</text>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="src/boiler-app.jsx"></script>
</body>
</html>
